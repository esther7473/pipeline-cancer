include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test        # détection de secrets
  - validate    # Terraform

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/infra/terraform-gcp
  TF_VERSION: "1.16.6"
  SECRET_DETECTION_ENABLED: "true"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.terraform:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - cd ${TF_ROOT}

terraform-fmt:
  extends: .terraform
  stage: validate
  script:
    - terraform fmt -check -recursive -diff

terraform-validate:
  extends: .terraform
  stage: validate
  script:
    - terraform init -backend=false
    - terraform validate